name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: go test ./...
      - name: Build
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir dist
          for t in linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=$V" -o dist/rivoo-agent-$os-$arch$ext ./cmd/rivoo-agent
          done
          cd dist && sha256sum rivoo-agent-* > checksums.txt
      - name: Manifest (signed)
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          V=${GITHUB_REF_NAME#v}
          BASE=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}
          python3 - "$V" "$BASE" > dist/latest.json <<'PY'
          import json, sys
          v, base = sys.argv[1], sys.argv[2]
          files = {}
          for line in open('dist/checksums.txt'):
              sha, name = line.split()
              key = name.removeprefix('rivoo-agent-').removesuffix('.exe')
              files[key] = {'url': f'{base}/{name}', 'sha256': sha}
          print(json.dumps({'version': v, 'files': files}, separators=(',', ':')), end='')
          PY
          go run ./scripts/sign dist/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMG=ghcr.io/${GITHUB_REPOSITORY}
          docker build --build-arg VERSION=${GITHUB_REF_NAME#v} -t $IMG:${GITHUB_REF_NAME#v} -t $IMG:latest .
          docker push $IMG --all-tags
